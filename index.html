<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FlowFieldCore v2.0 — Verification Suite & Stress-Test Sandbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px; background: #111; color: #ddd;
      display: grid; grid-template-columns: 320px 1fr; height: 100vh; overflow: hidden;
    }
    aside {
      background: #181818; border-right: 1px solid #333; padding: 10px;
      display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
    }
    main { display: flex; flex-direction: column; position: relative; background: #0a0a0a; }
    canvas { flex: 1; width: 100%; height: 100%; cursor: crosshair; image-rendering: pixelated; }
    fieldset { border: 1px solid #333; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    legend { color: #8af; font-weight: bold; padding: 0 4px; }
    .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    button, select, input {
      background: #252525; color: #eee; border: 1px solid #444; padding: 4px 6px;
      font: inherit; cursor: pointer;
    }
    button:hover { background: #333; border-color: #666; }
    button.active { background: #1b4b78; border-color: #59a6ff; }
    #log {
      background: #080808; border: 1px solid #2a2a2a; padding: 6px;
      font-size: 11px; line-height: 1.4; max-height: 260px; overflow-y: auto; white-space: pre-wrap;
    }
    .pass { color: #5f7; } .fail { color: #f55; } .metric { color: #fc5; }
    #hud {
      position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8);
      border: 1px solid #333; padding: 6px 10px; pointer-events: none; line-height: 1.5;
    }
  </style>
</head>
<body>
  <aside>
    <fieldset>
      <legend>1. Automated Verification & Stress Suite</legend>
      <div class="row">
        <button id="btnRunTests" style="width:100%;font-weight:bold;color:#7f9">▶ Run 14-Feature Test & Benchmark</button>
      </div>
      <div id="log">Initializing test suite...</div>
    </fieldset>

    <fieldset>
      <legend>2. Left-Click Brush / Interaction</legend>
      <div class="row" id="toolBar">
        <button data-tool="wall" class="active">Wall</button>
        <button data-tool="erase">Erase</button>
        <button data-tool="water">Water</button>
        <button data-tool="swamp">Swamp</button>
        <button data-tool="road">Road</button>
        <button data-tool="current">Current →</button>
        <button data-tool="oneway">One-Way ↓</button>
        <button data-tool="stamp">Stamp Box [4.1]</button>
        <button data-tool="goal">Move Goal</button>
      </div>
      <div class="row">
        <label>Brush Radius: <span id="lblRad">1</span></label>
        <input type="range" id="rngRad" min="0" max="5" value="1" />
      </div>
      <div style="color:#999;font-size:11px">Right-click anywhere on canvas to relocate Swarm & Vehicle Goal.</div>
    </fieldset>

    <fieldset>
      <legend>3. Diagnostic Overlay Layer</legend>
      <select id="selOverlay" style="width:100%">
        <option value="none">Terrain + Agents + Portals + Waypoints</option>
        <option value="integration">Swarm Integration Distance + Flow Arrows</option>
        <option value="sdf">[2.2] Exact Meijster EDT Wall SDF + Gradients</option>
        <option value="clearance">Clearance (Isotropic / Corridor X / Y)</option>
        <option value="congestion">[4.2] Continuum Crowd Density & Velocity Flux</option>
        <option value="landmarks">[3.2] ALT Landmarks & Super-Chunk Grid</option>
      </select>
    </fieldset>

    <fieldset>
      <legend>4. Crowd & Vehicle Simulation</legend>
      <div class="row">
        <label>Swarm Agents:</label>
        <select id="selAgentCount">
          <option value="300">300</option>
          <option value="1000" selected>1,000</option>
          <option value="2500">2,500</option>
          <option value="4500">4,500 (Stress)</option>
        </select>
      </div>
      <div class="row">
        <label><input type="checkbox" id="chkPistons" checked /> Moving Dynamic Pistons [1.1 / 4.1]</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="chkCrowd" checked /> Continuum Crowd Flux [4.2]</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="chkAvoid" checked /> Local Micro-Avoidance [4.3]</label>
      </div>
      <div class="row">
        <label><input type="checkbox" id="chkQuant" checked /> Quantized Int8/Uint16 Cache [5.1]</label>
      </div>
      <div class="row">
        <button id="btnResetMap" style="flex:1">Reset Map</button>
        <button id="btnRespawn" style="flex:1">Respawn Agents</button>
      </div>
    </fieldset>
  </aside>

  <main>
    <canvas id="cv"></canvas>
    <div id="hud"></div>
  </main>

  <script type="module">
    import {
      FlowFieldCore, GridWorld, PortalGraph, ChunkIntegrator,
      CS, CC, COST_OPEN, COST_BLOCK, DIR_FLAGS, QUANT_I_INF, QUANT_I_SCALE,
      hasWorldLOS
    } from './flow-field-pathfinder-api-core.js';

    //#region A: Automated 14-Feature Verification & Benchmark Suite
    const logEl = document.getElementById('log');
    const log = (html) => { logEl.innerHTML += html + '\n'; logEl.scrollTop = logEl.scrollHeight; };

    async function runVerificationSuite() {
      logEl.innerHTML = '<b>=== Running 14-Feature Verification Suite ===</b>\n';
      const assert = (cond, name, detail = '') => {
        if (cond) log(`<span class="pass">[PASS]</span> ${name} <span class="metric">${detail}</span>`);
        else log(`<span class="fail">[FAIL]</span> ${name} ${detail}`);
      };

      // Setup a 16x16 chunk (256x256 cells = 65,536 cells) benchmark world
      const tInit0 = performance.now();
      const sim = new FlowFieldCore({
        chunksX: 16, chunksY: 16,
        quantizeFields: true,
        wallRepulsion: { penaltyWeight: 2.0, repulsionWeight: 0.4, radius: 3.0 }
      });
      for (let y = 20; y < 220; y += 32) sim.setRect(16, y, 200, 3, COST_BLOCK);
      sim.rebuild();
      const tInit1 = performance.now();

      // [1.1] Surgical Chunk-Local Portal & CSR Patching
      const tSurg0 = performance.now();
      sim.setCost(50, 50, COST_BLOCK);
      sim.rebuild();
      const tSurg1 = performance.now();
      const surgMs = (tSurg1 - tSurg0).toFixed(2);
      assert(tSurg1 - tSurg0 < 10 && sim.graph.portals.length > 50, '1.1 Surgical CSR Patch', `(${surgMs} ms vs ${(tInit1 - tInit0).toFixed(1)} ms full)`);

      // [1.2] Undirected Fast-Path vs Directed Tarjan SCC
      const wasUndirected = !sim.graph.isDirected && sim.graph.sccReachWords === null;
      sim.grid.setDirectionMask(60, 60, DIR_FLAGS.E);
      sim.rebuild();
      const nowDirected = sim.graph.isDirected && sim.graph.sccReachWords !== null;
      assert(wasUndirected && nowDirected, '1.2 Lazy Undirected/Directed SCC', `(sccCount=${sim.graph.sccCount})`);

      // [2.1] 4-Pass Raster-Sweep Eikonal Solver (FIM)
      const it = new ChunkIntegrator();
      const outF = new Float32Array(CC);
      const tFim0 = performance.now();
      for (let i = 0; i < 200; i++) it.integrate(sim.grid, 0, [0], outF);
      const tFim1 = performance.now();
      assert(outF[CC - 1] > 0 && outF[CC - 1] < Infinity, '2.1 4-Pass Raster Eikonal FIM', `(${((tFim1 - tFim0) / 200 * 1000).toFixed(1)} µs/chunk)`);

      // [2.2] Exact Meijster Parabolic Envelope EDT for Wall SDF
      sim.setCost(100, 100, COST_BLOCK);
      sim.rebuild();
      const dDiag = sim.grid.wallDist[sim.grid.index(102, 102)];
      const expectedDiag = Math.hypot(2, 2);
      assert(Math.abs(dDiag - expectedDiag) < 0.05, '2.2 Meijster Exact EDT Wall SDF', `(d=${dDiag.toFixed(3)}, exact=${expectedDiag.toFixed(3)})`);

      // [3.2] & [3.3] ALT Landmarks & Affine Entry Bias A*
      const tPath0 = performance.now();
      const path = sim.findPath(8, 8, 240, 240);
      const tPath1 = performance.now();
      assert(path && path.chunks.length > 5 && sim.graph.numLandmarks > 0, '3.2/3.3 ALT Landmarks & Entry Bias', `(${(tPath1 - tPath0).toFixed(2)} ms, L=${sim.graph.numLandmarks})`);

      // [2.3] Funnel-Projected Continuous Portal Entry Seeding
      const stepRes = sim.getFieldForPath(path, 8.5, 8.5, 0);
      const vDir = { x: 0, y: 0 };
      const sampledOk = sim.sampleFlow(path, 8.5, 8.5, vDir, 0);
      assert(stepRes && sampledOk && Math.hypot(vDir.x, vDir.y) > 0.99, '2.3 Funnel Portal Seeding', `(vec=${vDir.x.toFixed(2)},${vDir.y.toFixed(2)})`);

      // [3.1] Any-Angle World-LOS Waypoint Polyline Extractor
      const wps = sim.extractWaypoints(8.5, 8.5, path);
      assert(wps && wps.length >= 2 && wps.length < path.chunks.length, '3.1 Any-Angle Waypoint Extractor', `(${path.chunks.length} chunks → ${wps.length} waypoints)`);

      // [4.1] Reference-Counted Overlapping Dynamic Obstacle Stamps
      const idA = sim.stampObstacle({ x: 30, y: 30, w: 4, h: 4 });
      const idB = sim.stampObstacle({ x: 32, y: 30, w: 4, h: 4 });
      const overlapCell = sim.grid.index(32, 31);
      const ref2 = sim.grid.dynamicObstacles[overlapCell] === 2;
      sim.unstampObstacle(idA);
      const ref1 = sim.grid.dynamicObstacles[overlapCell] === 1 && !sim.grid.isWalkable(32, 31);
      sim.moveObstacle(idB, 40, 40);
      const ref0 = sim.grid.dynamicObstacles[overlapCell] === 0 && sim.grid.isWalkable(32, 31);
      sim.unstampObstacle(idB);
      assert(ref2 && ref1 && ref0, '4.1 Ref-Counted Dynamic Obstacles', `(2→1→0 ref transitions verified)`);

      // [4.2] Continuum Crowd Congestion & Flux Splatting
      const fakeCrowd = Array.from({ length: 100 }, (_, i) => ({ x: 80 + (i % 10), y: 80 + ((i / 10) | 0), vx: 1, vy: 0 }));
      const dirtyCongChunks = sim.updateCrowdCongestion(fakeCrowd, { dirtyThreshold: 0.05 });
      assert(dirtyCongChunks > 0 && sim.grid.congestionFluxX[sim.grid.index(82, 82)] > 0, '4.2 Continuum Crowd Flux Splat', `(${dirtyCongChunks} chunks marked)`);

      // [1.3] Incremental Swarm Field Subtree Repair
      const swarm = sim.createSwarmField({ x: 240, y: 240 });
      const tSwarm0 = performance.now();
      sim.setCost(120, 120, COST_BLOCK);
      sim.rebuild(); // Automatically invokes updateSwarmField on active swarms
      const tSwarm1 = performance.now();
      const sVec = { x: 0, y: 0 };
      const sOk = sim.sampleSwarmFlow(swarm, 20.5, 20.5, sVec);
      assert(sOk && Math.hypot(sVec.x, sVec.y) > 0.99, '1.3 Incremental Swarm Repair', `(${(tSwarm1 - tSwarm0).toFixed(2)} ms repair)`);

      // [4.3] Wall-Safe Local Micro-Avoidance Kernel
      const avVec = { x: 1, y: 0 };
      sim.sampleSwarmFlow(swarm, 20.5, 20.5, avVec, {
        avoidAgents: [{ x: 20.5 + sVec.x * 0.5, y: 20.5 + sVec.y * 0.5, radius: 0.5 }]
      });
      const deflected = Math.abs(avVec.x - sVec.x) + Math.abs(avVec.y - sVec.y) > 0.01;
      assert(deflected, '4.3 Wall-Safe Local Avoidance', `(deflected safely)`);

      // [5.1] Quantized Int8/Uint16 Field Storage Verification
      const qField = sim.getFieldForSwarm(swarm, 20.5, 20.5);
      const isQuant = qField.quantized && qField.flowX instanceof Int8Array && qField.integration instanceof Uint16Array;
      const bytesPerChunk = qField.flowX.byteLength + qField.flowY.byteLength + qField.integration.byteLength;
      assert(isQuant && bytesPerChunk === 1024, '5.1 Quantized Int8/Uint16 Cache', `(${bytesPerChunk} B/chunk vs 3072 B Float32)`);

      // [5.2] Seqlock & SharedArrayBuffer Descriptor Hydration
      sim.grid.beginChunkWrite(0);
      const oddSeq = (sim.grid.chunkSeq[0] & 1) === 1;
      sim.grid.endChunkWrite(0);
      const evenSeq = (sim.grid.chunkSeq[0] & 1) === 0;
      const hydrated = GridWorld.fromSharedDescriptor(sim.grid.toSharedDescriptor());
      assert(oddSeq && evenSeq && hydrated.width === sim.width, '5.2 Seqlock & Worker Hydration', `(seq=${sim.grid.chunkSeq[0]})`);
    }
    //#endregion

    //#region B: Interactive Real-Time Sandbox & Crowd/Vehicle Simulation
    const TERRAIN_OPEN = 0, TERRAIN_WATER = 1, TERRAIN_SWAMP = 2, TERRAIN_ROAD = 3;
    const CHUNKS_X = 12, CHUNKS_Y = 8; // 192 x 128 cells

    let core, swarmLand, swarmAmphib, goalPos = { x: 174, y: 64 };
    let agents = [], vehicles = [], pistons = [], userStamps = [];
    let currentTool = 'wall', brushRadius = 1;
    let frameMs = 0, lastRebuildMs = 0, rebuildCount = 0;

    function initWorld() {
      const quant = document.getElementById('chkQuant').checked;
      core = new FlowFieldCore({
        chunksX: CHUNKS_X, chunksY: CHUNKS_Y,
        quantizeFields: quant,
        wallRepulsion: { penaltyWeight: 2.2, repulsionWeight: 0.45, radius: 3.0 }
      });

      // Register Unit Movement Profiles
      core.registerProfile('land', {
        [TERRAIN_OPEN]: COST_OPEN,
        [TERRAIN_ROAD]: 1,
        [TERRAIN_SWAMP]: 10,
        [TERRAIN_WATER]: COST_BLOCK
      });
      core.registerProfile('amphibious', {
        [TERRAIN_OPEN]: COST_OPEN + 1,
        [TERRAIN_ROAD]: 1,
        [TERRAIN_SWAMP]: 4,
        [TERRAIN_WATER]: 4 // Amphibious units can swim across water!
      });

      const W = core.width, H = core.height;

      // Central River (Water) with Bridges (Road) and downward current
      core.setRectTerrain(90, 0, 12, H, TERRAIN_WATER);
      core.grid.setRectCurrent(90, 0, 12, H, 0, 0.65);
      // North & South Bridges
      core.setRectTerrain(88, 24, 16, 8, TERRAIN_ROAD);
      core.setRectTerrain(88, 96, 16, 8, TERRAIN_ROAD);
      core.grid.setRectCurrent(88, 24, 16, 8, 0, 0);
      core.grid.setRectCurrent(88, 96, 16, 8, 0, 0);

      // Highway Road & Swamp Basin
      core.setRectTerrain(12, 60, 76, 6, TERRAIN_ROAD);
      core.setRectTerrain(118, 45, 28, 38, TERRAIN_SWAMP);

      // Fortress Walls with wide & narrow gates
      core.setRect(48, 12, 4, 42, COST_BLOCK);
      core.setRect(48, 70, 4, 46, COST_BLOCK);
      core.setRect(148, 16, 4, 38, COST_BLOCK);
      core.setRect(148, 74, 4, 38, COST_BLOCK);

      // One-way valve corridor at top-right
      core.setRect(148, 8, 4, 8, COST_OPEN);
      for (let y = 8; y < 16; y++) {
        for (let x = 148; x < 152; x++) core.grid.setDirectionMask(x, y, DIR_FLAGS.W);
      }

      // Moving Dynamic Pistons ([4.1] stampObstacle + moveObstacle)
      pistons = [
        { id: core.stampObstacle({ x: 68, y: 25, w: 5, h: 12 }), baseX: 68, baseY: 25, ampY: 16, speed: 1.8, phase: 0 },
        { id: core.stampObstacle({ x: 128, y: 20, w: 5, h: 12 }), baseX: 128, baseY: 20, ampY: 14, speed: 2.3, phase: 2.0 }
      ];
      userStamps = [];

      rebuildGoals();
      spawnAllEntities();
    }

    function rebuildGoals() {
      const t0 = performance.now();
      if (swarmLand) core.disposeSwarmField(swarmLand);
      if (swarmAmphib) core.disposeSwarmField(swarmAmphib);
      swarmLand = core.createSwarmField(goalPos, { profile: 'land', minClearance: 1 });
      swarmAmphib = core.createSwarmField(goalPos, { profile: 'amphibious', minClearance: 1 });
      repathVehicles();
      lastRebuildMs = performance.now() - t0;
    }

    function repathVehicles() {
      for (const v of vehicles) {
        v.path = core.findPath(v.x, v.y, goalPos.x, goalPos.y, {
          profile: 'land',
          footprint: v.footprint
        });
        v.waypoints = v.path ? core.extractWaypoints(v.x, v.y, v.path) : null;
        v.chunkHint = 0;
      }
    }

    function spawnAllEntities() {
      const count = parseInt(document.getElementById('selAgentCount').value, 10);
      agents = [];
      for (let i = 0; i < count; i++) {
        let x, y;
        do {
          x = 6 + Math.random() * 36;
          y = 8 + Math.random() * (core.height - 16);
        } while (!core.grid.isWalkable(x | 0, y | 0, 1, 'land'));
        const isAmphib = (i % 4) === 0;
        agents.push({
          x, y, vx: 0, vy: 0,
          speed: isAmphib ? 16 : 19,
          profile: isAmphib ? 'amphibious' : 'land',
          radius: 0.38
        });
      }

      // Spawn Rectangular Vehicles (2x4 footprint)
      vehicles = [
        { x: 18, y: 28, vx: 1, vy: 0, speed: 14, footprint: { width: 2, length: 4, turnPenalty: 3.0 }, path: null, waypoints: null, chunkHint: 0, color: '#ff9f43' },
        { x: 18, y: 100, vx: 1, vy: 0, speed: 14, footprint: { width: 2, length: 4, turnPenalty: 3.0 }, path: null, waypoints: null, chunkHint: 0, color: '#ff6b6b' }
      ];
      repathVehicles();
    }

    // Spatial Hash for O(1) Local Micro-Avoidance ([4.3])
    const SH_CELL = 3;
    let shBuckets = new Map();
    function buildSpatialHash() {
      shBuckets.clear();
      const stride = Math.ceil(core.width / SH_CELL);
      for (let i = 0; i < agents.length; i++) {
        const a = agents[i];
        const key = ((a.y / SH_CELL) | 0) * stride + ((a.x / SH_CELL) | 0);
        let b = shBuckets.get(key);
        if (!b) { b = []; shBuckets.set(key, b); }
        b.push(a);
      }
    }

    function getLocalNeighbors(x, y, selfAgent) {
      const stride = Math.ceil(core.width / SH_CELL);
      const bx = (x / SH_CELL) | 0, by = (y / SH_CELL) | 0;
      const out = [];
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          const b = shBuckets.get((by + dy) * stride + (bx + dx));
          if (!b) continue;
          for (let i = 0; i < b.length; i++) {
            if (b[i] !== selfAgent) {
              out.push(b[i]);
              if (out.length >= 8) return out;
            }
          }
        }
      }
      return out;
    }

    let simTime = 0, crowdTick = 0;
    function stepSimulation(dt) {
      const t0 = performance.now();
      simTime += dt;

      // 1. Animate dynamic obstacle pistons ([4.1] + [1.1] surgical CSR rebuild)
      if (document.getElementById('chkPistons').checked) {
        for (const p of pistons) {
          const ny = Math.round(p.baseY + Math.sin(simTime * p.speed + p.phase) * p.ampY);
          core.moveObstacle(p.id, p.baseX, ny);
        }
      }

      // 2. Continuum Crowd Congestion Splatting ([4.2]) at 10 Hz
      if (document.getElementById('chkCrowd').checked && (++crowdTick % 6 === 0)) {
        core.updateCrowdCongestion(agents, { decay: 0.82, splatWeight: 1.8, dirtyThreshold: 0.25 });
      }

      // 3. Execute surgical rebuild if any topology or weights changed
      if (core.grid.dirtyChunks.size > 0) {
        const tr0 = performance.now();
        core.rebuild();
        repathVehicles();
        lastRebuildMs = performance.now() - tr0;
        rebuildCount++;
      }

      // 4. Step Swarm Agents
      const useAvoid = document.getElementById('chkAvoid').checked;
      if (useAvoid) buildSpatialHash();
      const dir = { x: 0, y: 0 };
      const T = core.grid.terrainIds;

      for (let i = 0; i < agents.length; i++) {
        const a = agents[i];
        if (Math.hypot(a.x - goalPos.x, a.y - goalPos.y) < 3.0) {
          a.x = 6 + Math.random() * 28;
          a.y = 8 + Math.random() * (core.height - 16);
          continue;
        }
        const swarm = a.profile === 'amphibious' ? swarmAmphib : swarmLand;
        const avoidOpts = useAvoid ? { avoidAgents: getLocalNeighbors(a.x, a.y, a), selfRadius: a.radius } : null;
        if (core.sampleSwarmFlow(swarm, a.x, a.y, dir, avoidOpts)) {
          a.vx = a.vx * 0.65 + dir.x * 0.35;
          a.vy = a.vy * 0.65 + dir.y * 0.35;
          const vl = Math.hypot(a.vx, a.vy) || 1;
          a.vx /= vl; a.vy /= vl;

          const cellIdx = core.grid.index(a.x | 0, a.y | 0);
          const tid = T ? T[cellIdx] : 0;
          const tMult = tid === TERRAIN_ROAD ? 1.35 : (tid === TERRAIN_SWAMP ? 0.45 : (tid === TERRAIN_WATER ? 0.65 : 1.0));
          const nx = a.x + a.vx * a.speed * tMult * dt;
          const ny = a.y + a.vy * a.speed * tMult * dt;
          if (core.grid.isWalkable(nx | 0, ny | 0, 1, a.profile)) {
            a.x = nx; a.y = ny;
          } else {
            a.x += dir.x * a.speed * 0.5 * dt;
            a.y += dir.y * a.speed * 0.5 * dt;
          }
        }
      }

      // 5. Step Rectangular Vehicles (2x4 Footprint + Path Flow Sampling)
      for (const v of vehicles) {
        if (!v.path || Math.hypot(v.x - goalPos.x, v.y - goalPos.y) < 4.0) {
          v.x = 18;
          v.y = v === vehicles[0] ? 28 : 100;
          repathVehicles();
          continue;
        }
        const res = core.getFieldForPath(v.path, v.x, v.y, v.chunkHint);
        if (res) v.chunkHint = res.chunkIndex;
        if (core.sampleFlow(v.path, v.x, v.y, dir, v.chunkHint)) {
          v.vx = v.vx * 0.8 + dir.x * 0.2;
          v.vy = v.vy * 0.8 + dir.y * 0.2;
          const l = Math.hypot(v.vx, v.vy) || 1;
          v.vx /= l; v.vy /= l;
          v.x += v.vx * v.speed * dt;
          v.y += v.vy * v.speed * dt;
        }
      }

      frameMs = performance.now() - t0;
    }

    //#region C: Canvas Renderer & Diagnostic Overlays
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const offCv = document.createElement('canvas');
    const offCtx = offCv.getContext('2d');
    let imgData = null;

    function render() {
      const W = core.width, H = core.height;
      if (offCv.width !== W || offCv.height !== H) {
        offCv.width = W; offCv.height = H;
        imgData = offCtx.createImageData(W, H);
      }
      if (cv.width !== cv.clientWidth || cv.height !== cv.clientHeight) {
        cv.width = cv.clientWidth; cv.height = cv.clientHeight;
      }

      const overlay = document.getElementById('selOverlay').value;
      const data = imgData.data;
      const { costs, terrainIds: T, dynamicObstacles: D, wallDist, clearance, congestion } = core.grid;

      // 1. Per-Cell Pixel Buffer Pass
      for (let i = 0; i < W * H; i++) {
        const p = i * 4;
        if (costs[i] >= COST_BLOCK) {
          data[p] = 52; data[p + 1] = 56; data[p + 2] = 64; data[p + 3] = 255;
          continue;
        }
        if (D && D[i] > 0) {
          data[p] = 210; data[p + 1] = 95; data[p + 2] = 45; data[p + 3] = 255;
          continue;
        }

        if (overlay === 'sdf' && wallDist) {
          const d = Math.min(1, wallDist[i] / 6);
          data[p] = (1 - d) * 220; data[p + 1] = d * 140; data[p + 2] = d * 240; data[p + 3] = 255;
        } else if (overlay === 'clearance' && clearance) {
          const c = Math.min(1, clearance[i] / 8);
          data[p] = c * 40; data[p + 1] = c * 200; data[p + 2] = (1 - c) * 160; data[p + 3] = 255;
        } else if (overlay === 'congestion' && congestion) {
          const cg = Math.min(1, congestion[i] / 5);
          data[p] = 20 + cg * 235; data[p + 1] = 25 + (1 - cg) * 40; data[p + 2] = 35; data[p + 3] = 255;
        } else {
          const tid = T ? T[i] : 0;
          if (tid === TERRAIN_WATER) { data[p] = 18; data[p + 1] = 58; data[p + 2] = 110; }
          else if (tid === TERRAIN_SWAMP) { data[p] = 34; data[p + 1] = 52; data[p + 2] = 28; }
          else if (tid === TERRAIN_ROAD) { data[p] = 48; data[p + 1] = 46; data[p + 2] = 42; }
          else { data[p] = 22; data[p + 1] = 25; data[p + 2] = 30; }
          data[p + 3] = 255;
        }
      }

      // Overlay Swarm Integration Distance if selected
      if (overlay === 'integration' && swarmLand) {
        for (let c = 0; c < core.grid.chunkCount; c++) {
          const f = core.cache.getSwarmChunkField(c, swarmLand);
          if (!f) continue;
          for (let ly = 0; ly < CS; ly++) {
            for (let lx = 0; lx < CS; lx++) {
              const d = core.cache.readIntegration(f, ly * CS + lx);
              if (d === Infinity) continue;
              const gi = (f.originY + ly) * W + (f.originX + lx), p = gi * 4;
              const v = Math.sin(d * 0.15) * 25 + Math.max(0, 180 - d * 0.45);
              data[p] = v * 0.3; data[p + 1] = v * 0.7; data[p + 2] = v;
            }
          }
        }
      }

      offCtx.putImageData(imgData, 0, 0);

      // Scale offscreen buffer to main canvas
      const scale = Math.min(cv.width / W, cv.height / H);
      const ox = (cv.width - W * scale) * 0.5, oy = (cv.height - H * scale) * 0.5;
      ctx.fillStyle = '#080808';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.save();
      ctx.translate(ox, oy);
      ctx.scale(scale, scale);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(offCv, 0, 0);

      // 2. Draw Chunk Grid & Portals
      ctx.lineWidth = 1 / scale;
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      for (let x = 0; x <= W; x += CS) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y <= H; y += CS) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      // Draw Portals
      ctx.strokeStyle = 'rgba(80, 200, 255, 0.35)';
      ctx.lineWidth = 1.5 / scale;
      for (const p of core.graph.portals) {
        ctx.beginPath();
        if (p.isH) { ctx.moveTo(p.start, p.border); ctx.lineTo(p.end + 1, p.border); }
        else { ctx.moveTo(p.border, p.start); ctx.lineTo(p.border, p.end + 1); }
        ctx.stroke();
      }

      // Draw Vector Arrows for active overlay
      if (overlay === 'integration' && swarmLand) {
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1 / scale;
        const v = { x: 0, y: 0 };
        for (let y = 2; y < H; y += 4) {
          for (let x = 2; x < W; x += 4) {
            if (core.sampleSwarmFlow(swarmLand, x + 0.5, y + 0.5, v)) {
              ctx.beginPath();
              ctx.moveTo(x + 0.5, y + 0.5);
              ctx.lineTo(x + 0.5 + v.x * 1.6, y + 0.5 + v.y * 1.6);
              ctx.stroke();
            }
          }
        }
      } else if (overlay === 'landmarks' && core.graph.landmarks) {
        ctx.strokeStyle = 'rgba(255, 200, 50, 0.25)';
        ctx.lineWidth = 2 / scale;
        for (let x = 0; x <= W; x += CS * 4) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
        for (let y = 0; y <= H; y += CS * 4) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        ctx.fillStyle = '#ff0';
        for (const pid of core.graph.landmarks) {
          const p = core.graph.portals[pid];
          if (p) { ctx.beginPath(); ctx.arc(p.anchorX, p.anchorY, 2.2, 0, Math.PI * 2); ctx.fill(); }
        }
      }

      // 3. Draw Any-Angle Extracted Waypoints ([3.1]) & Rectangular Vehicles
      for (const v of vehicles) {
        if (v.waypoints) {
          ctx.strokeStyle = v.color;
          ctx.lineWidth = 1.8 / scale;
          ctx.beginPath();
          for (let i = 0; i < v.waypoints.length; i++) {
            const wp = v.waypoints[i];
            if (i === 0) ctx.moveTo(wp.x, wp.y); else ctx.lineTo(wp.x, wp.y);
          }
          ctx.stroke();
        }
        // Draw oriented 2x4 vehicle body
        ctx.save();
        ctx.translate(v.x, v.y);
        ctx.rotate(Math.atan2(v.vy, v.vx));
        ctx.fillStyle = v.color;
        ctx.fillRect(-2, -1, 4, 2);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 0.5 / scale;
        ctx.strokeRect(-2, -1, 4, 2);
        ctx.restore();
      }

      // 4. Draw Swarm Agents (Green = Land Profile, Cyan = Amphibious Profile)
      for (let i = 0; i < agents.length; i++) {
        const a = agents[i];
        ctx.fillStyle = a.profile === 'amphibious' ? '#00e5ff' : '#69f0ae';
        ctx.fillRect(a.x - 0.45, a.y - 0.45, 0.9, 0.9);
      }

      // 5. Draw Goal Marker
      ctx.strokeStyle = '#ff3366';
      ctx.lineWidth = 2 / scale;
      ctx.beginPath();
      ctx.arc(goalPos.x, goalPos.y, 3.0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();

      // Update Telemetry HUD
      document.getElementById('hud').innerHTML =
        `<b>World:</b> ${W}×${H} (${core.grid.chunkCount} chunks) | <b>Portals:</b> ${core.graph.portals.length} | <b>Landmarks:</b> ${core.graph.numLandmarks}<br>` +
        `<b>Agents:</b> ${agents.length} + ${vehicles.length} vehicles (2×4 footprint) | <b>Cache Entries:</b> ${core.cache.entries.size} (${core.quantizeFields ? 'Quantized 1KB' : 'Float32 3KB'})<br>` +
        `<b>Sim Step:</b> ${frameMs.toFixed(2)} ms | <b>Last Incremental Rebuild:</b> ${lastRebuildMs.toFixed(2)} ms (Total: ${rebuildCount})`;
    }
    //#endregion

    //#region D: UI Controls & Mouse Painting
    function screenToGrid(e) {
      const rect = cv.getBoundingClientRect();
      const W = core.width, H = core.height;
      const scale = Math.min(cv.width / W, cv.height / H);
      const ox = (cv.width - W * scale) * 0.5, oy = (cv.height - H * scale) * 0.5;
      const gx = ((e.clientX - rect.left) - ox) / scale;
      const gy = ((e.clientY - rect.top) - oy) / scale;
      return { x: gx, y: gy };
    }

    function applyTool(gx, gy) {
      const ix = gx | 0, iy = gy | 0;
      if (!core.grid.inBounds(ix, iy)) return;
      const r = brushRadius;
      if (currentTool === 'goal') {
        goalPos = { x: gx, y: gy };
        rebuildGoals();
      } else if (currentTool === 'stamp') {
        userStamps.push(core.stampObstacle({ x: ix - 2, y: iy - 2, w: 4, h: 4 }));
      } else if (currentTool === 'wall') {
        core.setDisc(gx, gy, r + 0.5, COST_BLOCK);
      } else if (currentTool === 'erase') {
        core.setDisc(gx, gy, r + 0.5, COST_OPEN);
        core.setRectTerrain(ix - r, iy - r, r * 2 + 1, r * 2 + 1, TERRAIN_OPEN);
        core.grid.setRectCurrent(ix - r, iy - r, r * 2 + 1, r * 2 + 1, 0, 0);
      } else if (currentTool === 'water') {
        core.setRectTerrain(ix - r, iy - r, r * 2 + 1, r * 2 + 1, TERRAIN_WATER);
      } else if (currentTool === 'swamp') {
        core.setRectTerrain(ix - r, iy - r, r * 2 + 1, r * 2 + 1, TERRAIN_SWAMP);
      } else if (currentTool === 'road') {
        core.setRectTerrain(ix - r, iy - r, r * 2 + 1, r * 2 + 1, TERRAIN_ROAD);
      } else if (currentTool === 'current') {
        core.grid.setRectCurrent(ix - r, iy - r, r * 2 + 1, r * 2 + 1, 0.85, 0);
      } else if (currentTool === 'oneway') {
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) core.grid.setDirectionMask(ix + dx, iy + dy, DIR_FLAGS.S);
        }
      }
    }

    let isDown = false;
    cv.addEventListener('mousedown', (e) => {
      const pt = screenToGrid(e);
      if (e.button === 2) {
        goalPos = { x: pt.x, y: pt.y };
        rebuildGoals();
        return;
      }
      isDown = true;
      applyTool(pt.x, pt.y);
    });
    cv.addEventListener('mousemove', (e) => {
      if (isDown && currentTool !== 'stamp') {
        const pt = screenToGrid(e);
        applyTool(pt.x, pt.y);
      }
    });
    window.addEventListener('mouseup', () => { isDown = false; });
    cv.addEventListener('contextmenu', (e) => e.preventDefault());

    document.getElementById('toolBar').addEventListener('click', (e) => {
      if (e.target.dataset.tool) {
        currentTool = e.target.dataset.tool;
        for (const b of document.querySelectorAll('#toolBar button')) b.classList.toggle('active', b === e.target);
      }
    });
    document.getElementById('rngRad').addEventListener('input', (e) => {
      brushRadius = parseInt(e.target.value, 10);
      document.getElementById('lblRad').textContent = brushRadius;
    });
    document.getElementById('btnRunTests').addEventListener('click', runVerificationSuite);
    document.getElementById('btnResetMap').addEventListener('click', initWorld);
    document.getElementById('btnRespawn').addEventListener('click', spawnAllEntities);
    document.getElementById('selAgentCount').addEventListener('change', spawnAllEntities);
    document.getElementById('chkQuant').addEventListener('change', initWorld);

    // Boot Suite & Animation Loop
    initWorld();
    runVerificationSuite();

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      stepSimulation(dt);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    //#endregion
  </script>
</body>
</html>
